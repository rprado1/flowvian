[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flowvian"
version = "1.0.0"
description = "Visual workflow builder for automation with OpenAI Responses integration, featuring a Flask backend, React UI, and Windows executable export."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "flask==3.1.1",
    "waitress>=3.0.0",
    "pyinstaller==6.11.1",
]

[project.scripts]
wbui = "run:cli"

[tool.setuptools]
include-package-data = true
py-modules = ["run"]

[tool.setuptools.packages.find]
include = ["app", "app.*"]

[tool.setuptools.package-data]
app = ["static/dist/**"]
